<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A320 PIA Flight Simulator - Advanced Cockpit</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    :root {
      --bg: #0a0e14;
      --panel: #0f1419;
      --accent: #00d4ff;
      --accent-dark: #0099cc;
      --text: #e0e6ed;
      --text-dim: #8a92a2;
      --green: #00ff41;
      --amber: #ffb800;
      --red: #ff3333;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: 'Courier New', monospace;
      overflow: hidden;
    }

    .simulator {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-rows: 50px 1fr 140px;
    }

    .header {
      background: linear-gradient(180deg, #1a1f27, #0f1419);
      border-bottom: 2px solid var(--accent);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      font-size: 16px;
      font-weight: bold;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .header-title {
      color: var(--accent);
      text-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
    }

    .header-info {
      display: flex;
      gap: 30px;
      font-size: 11px;
      color: var(--text-dim);
    }

    .header-info span {
      color: var(--accent);
    }

    .main-content {
      display: grid;
      grid-template-columns: 280px 1fr 260px;
      gap: 10px;
      padding: 10px;
      background: var(--bg);
    }

    .panel {
      background: linear-gradient(180deg, #12171f, #0d111a);
      border: 2px solid rgba(0, 212, 255, 0.3);
      border-radius: 8px;
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .section {
      background: rgba(15, 20, 25, 0.8);
      border: 1px solid rgba(0, 212, 255, 0.2);
      border-radius: 6px;
      padding: 10px;
    }

    .section-title {
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 8px;
      border-bottom: 1px solid rgba(0, 212, 255, 0.15);
      padding-bottom: 6px;
    }

    .control-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 10px;
    }

    .label {
      color: var(--text-dim);
      text-transform: uppercase;
    }

    .value {
      color: var(--accent);
      font-weight: bold;
    }

    .btn {
      background: rgba(0, 212, 255, 0.1);
      border: 1px solid rgba(0, 212, 255, 0.3);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 9px;
      text-transform: uppercase;
      cursor: pointer;
      font-family: 'Courier New', monospace;
      font-weight: bold;
      transition: 0.2s;
      margin-top: 4px;
    }

    .btn:hover {
      background: rgba(0, 212, 255, 0.2);
      box-shadow: 0 0 8px rgba(0, 212, 255, 0.3);
    }

    .btn.active {
      background: var(--accent);
      color: var(--bg);
      box-shadow: 0 0 12px rgba(0, 212, 255, 0.6);
    }

    .viewport {
      background: #0a0e14;
      border: 2px solid rgba(0, 212, 255, 0.3);
      border-radius: 8px;
      position: relative;
      overflow: hidden;
    }

    #canvas3d {
      width: 100%;
      height: 100%;
    }

    .instruments {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .instrument {
      background: rgba(15, 20, 25, 0.8);
      border: 1px solid rgba(0, 212, 255, 0.2);
      border-radius: 6px;
      padding: 10px;
    }

    .instrument-label {
      font-size: 9px;
      color: var(--text-dim);
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .instrument-value {
      font-size: 16px;
      font-weight: bold;
      color: var(--accent);
      text-align: center;
      text-shadow: 0 0 6px rgba(0, 212, 255, 0.4);
    }

    .footer {
      background: linear-gradient(180deg, #12171f, #0d111a);
      border-top: 2px solid rgba(0, 212, 255, 0.3);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 10px;
      gap: 20px;
    }

    .control-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .yoke {
      width: 100px;
      height: 100px;
      border: 3px solid var(--accent);
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(0, 212, 255, 0.1), rgba(0, 0, 0, 0.5));
      cursor: grab;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
      position: relative;
    }

    .yoke.active {
      box-shadow: 0 0 30px rgba(0, 212, 255, 0.6);
    }

    .yoke-center {
      width: 24px;
      height: 24px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(0, 212, 255, 0.7);
    }

    .yoke-label {
      font-size: 8px;
      color: var(--text-dim);
      text-transform: uppercase;
      position: absolute;
      bottom: -18px;
    }

    .throttles {
      display: flex;
      gap: 15px;
      align-items: flex-end;
    }

    .throttle {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .throttle-bar {
      width: 20px;
      height: 80px;
      background: rgba(0, 0, 0, 0.4);
      border: 2px solid var(--accent);
      border-radius: 4px;
      position: relative;
      cursor: ns-resize;
      overflow: hidden;
    }

    .throttle-fill {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 0%;
      background: linear-gradient(180deg, var(--green), var(--accent));
      box-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
    }

    .throttle-label {
      font-size: 8px;
      text-transform: uppercase;
      color: var(--text-dim);
    }

    .throttle-value {
      font-size: 10px;
      color: var(--accent);
      font-weight: bold;
    }

    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(0, 212, 255, 0.3);
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <div class="simulator">
    <div class="header">
      <div class="header-title">✈ A320 PIA FLIGHT SIMULATOR</div>
      <div class="header-info">
        <div>Flight Time: <span id="flightTime">00:00:00</span></div>
        <div>Status: <span id="statusText">READY</span></div>
        <div>Registration: <span>AP-BGC</span></div>
      </div>
    </div>

    <div class="main-content">
      <!-- LEFT PANEL -->
      <div class="panel">
        <div class="section">
          <div class="section-title">Flight Mode</div>
          <button class="btn active" id="modeBtn0">Takeoff</button>
          <button class="btn" id="modeBtn1">Climb</button>
          <button class="btn" id="modeBtn2">Cruise</button>
          <button class="btn" id="modeBtn3">Descent</button>
        </div>

        <div class="section">
          <div class="section-title">Systems</div>
          <div class="control-row">
            <span class="label">Autopilot</span>
            <span class="value" id="apDisplay">OFF</span>
          </div>
          <button class="btn" id="btnAP">AUTOPILOT</button>

          <div class="control-row" style="margin-top: 8px;">
            <span class="label">Gear</span>
            <span class="value" id="gearDisplay">UP</span>
          </div>
          <button class="btn" id="btnGear">GEAR DOWN</button>

          <div class="control-row" style="margin-top: 8px;">
            <span class="label">Flaps</span>
            <span class="value" id="flapsDisplay">0°</span>
          </div>
          <input type="range" id="flapsSlider" min="0" max="4" value="0" style="width: 100%; margin-top: 6px;">
        </div>

        <div class="section">
          <div class="section-title">Engines</div>
          <button class="btn" id="btnEng1">START ENG 1</button>
          <button class="btn" id="btnEng2">START ENG 2</button>
        </div>
      </div>

      <!-- CENTER: 3D VIEW -->
      <div class="viewport">
        <canvas id="canvas3d"></canvas>
      </div>

      <!-- RIGHT PANEL -->
      <div class="panel">
        <div class="instruments">
          <div class="instrument">
            <div class="instrument-label">Altitude</div>
            <div class="instrument-value" id="altValue">0 ft</div>
          </div>

          <div class="instrument">
            <div class="instrument-label">Airspeed</div>
            <div class="instrument-value" id="speedValue">0 kts</div>
          </div>

          <div class="instrument">
            <div class="instrument-label">V/S</div>
            <div class="instrument-value" id="vsValue">0 fpm</div>
          </div>

          <div class="instrument">
            <div class="instrument-label">Heading</div>
            <div class="instrument-value" id="headingValue">090°</div>
          </div>

          <div class="instrument">
            <div class="instrument-label">Pitch</div>
            <div class="instrument-value" id="pitchValue">0.0°</div>
          </div>

          <div class="instrument">
            <div class="instrument-label">Bank</div>
            <div class="instrument-value" id="bankValue">0.0°</div>
          </div>

          <div class="instrument">
            <div class="instrument-label">Fuel</div>
            <div class="instrument-value" id="fuelValue">25000 kg</div>
          </div>

          <div class="instrument">
            <div class="instrument-label">N1</div>
            <div class="instrument-value" id="n1Value">0%</div>
          </div>
        </div>
      </div>
    </div>

    <!-- FOOTER -->
    <div class="footer">
      <div class="control-section">
        <div class="yoke" id="yoke">
          <div class="yoke-center"></div>
          <div class="yoke-label">PITCH/ROLL</div>
        </div>
      </div>

      <div class="throttles">
        <div class="throttle">
          <div class="throttle-bar" id="throttle1">
            <div class="throttle-fill"></div>
          </div>
          <div class="throttle-label">ENG 1</div>
          <div class="throttle-value" id="throttle1Value">0%</div>
        </div>
        <div class="throttle">
          <div class="throttle-bar" id="throttle2">
            <div class="throttle-fill"></div>
          </div>
          <div class="throttle-label">ENG 2</div>
          <div class="throttle-value" id="throttle2Value">0%</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Flight State
    const aircraft = {
      position: { x: 0, y: 0, z: 0 },
      velocity: { x: 0, y: 0, z: 0 },
      orientation: { pitch: 0, roll: 0, yaw: 90 },
      speed: 0,
      altitude: 0,
      heading: 90,
      verticalSpeed: 0,
      throttle1: 0,
      throttle2: 0,
      flaps: 0,
      gearDown: false,
      autopilot: false,
      engine1Running: false,
      engine2Running: false,
      n1_1: 0,
      n1_2: 0,
      fuel: 25000,
      flightTime: 0,
      mode: 'takeoff',
      targetHeading: 90,
      targetAltitude: 5000
    };

    // Three.js Scene Setup
    const canvas = document.getElementById('canvas3d');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, canvas.clientWidth / canvas.clientHeight, 0.1, 10000);
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(canvas.clientWidth, canvas.clientHeight);
    renderer.setClearColor(0x1e5a8e);

    camera.position.set(40, 30, -60);
    camera.lookAt(0, 0, 0);

    // Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);
    const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
    directionalLight.position.set(10, 20, 10);
    scene.add(directionalLight);

    // Sky
    const skyGeometry = new THREE.SphereGeometry(2000, 32, 32);
    const skyMaterial = new THREE.MeshBasicMaterial({
      color: 0x87ceeb,
      side: THREE.BackSide
    });
    const sky = new THREE.Mesh(skyGeometry, skyMaterial);
    scene.add(sky);

    // Ground
    const groundGeometry = new THREE.PlaneGeometry(2000, 2000);
    const groundMaterial = new THREE.MeshStandardMaterial({ color: 0x2d5a2d });
    const ground = new THREE.Mesh(groundGeometry, groundMaterial);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -5;
    scene.add(ground);

    // Create A320 Aircraft
    function createA320() {
      const group = new THREE.Group();

      // Fuselage
      const fuselageGeometry = new THREE.CylinderGeometry(3.95, 3.95, 70, 32);
      const fuselageMaterial = new THREE.MeshStandardMaterial({ color: 0xffffff });
      const fuselage = new THREE.Mesh(fuselageGeometry, fuselageMaterial);
      fuselage.castShadow = true;
      fuselage.receiveShadow = true;
      group.add(fuselage);

      // Cockpit
      const cockpitGeometry = new THREE.ConeGeometry(3.8, 8, 32);
      const cockpitMaterial = new THREE.MeshStandardMaterial({ color: 0xb0c4de });
      const cockpit = new THREE.Mesh(cockpitGeometry, cockpitMaterial);
      cockpit.position.z = 35;
      cockpit.castShadow = true;
      group.add(cockpit);

      // Wings
      const wingGeometry = new THREE.BoxGeometry(120, 1.5, 25);
      const wingMaterial = new THREE.MeshStandardMaterial({ color: 0xffffff });
      const wings = new THREE.Mesh(wingGeometry, wingMaterial);
      wings.castShadow = true;
      wings.receiveShadow = true;
      group.add(wings);

      // Tail
      const tailGeometry = new THREE.BoxGeometry(2, 25, 15);
      const tailMaterial = new THREE.MeshStandardMaterial({ color: 0x1a1a4d });
      const tail = new THREE.Mesh(tailGeometry, tailMaterial);
      tail.position.z = -35;
      tail.castShadow = true;
      group.add(tail);

      // Tail cone
      const tailConeGeometry = new THREE.ConeGeometry(3.5, 10, 32);
      const tailCone = new THREE.Mesh(tailConeGeometry, tailMaterial);
      tailCone.position.z = -38;
      group.add(tailCone);

      // Tail decoration (crescent)
      const crescentGeometry = new THREE.CircleGeometry(8, 32);
      const crescentMaterial = new THREE.MeshStandardMaterial({ color: 0xffffff });
      const crescent = new THREE.Mesh(crescentGeometry, crescentMaterial);
      crescent.position.set(0, 12, -34);
      crescent.rotation.x = Math.PI / 2;
      group.add(crescent);

      // Engines
      const engineGeometry = new THREE.CylinderGeometry(2.5, 2.5, 8, 32);
      const engineMaterial = new THREE.MeshStandardMaterial({ color: 0x444444 });
      
      const engine1 = new THREE.Mesh(engineGeometry, engineMaterial);
      engine1.position.set(-45, -3, 0);
      group.add(engine1);

      const engine2 = new THREE.Mesh(engineGeometry, engineMaterial);
      engine2.position.set(45, -3, 0);
      group.add(engine2);

      // Landing gear
      const gearGeometry = new THREE.CylinderGeometry(1, 1, 3, 16);
      const gearMaterial = new THREE.MeshStandardMaterial({ color: 0x333333 });
      
      const gearF = new THREE.Mesh(gearGeometry, gearMaterial);
      gearF.position.set(0, -5, 10);
      group.add(gearF);

      const gearL = new THREE.Mesh(gearGeometry, gearMaterial);
      gearL.position.set(-20, -5, -5);
      group.add(gearL);

      const gearR = new THREE.Mesh(gearGeometry, gearMaterial);
      gearR.position.set(20, -5, -5);
      group.add(gearR);

      return group;
    }

    const a320 = createA320();
    scene.add(a320);

    // Input Handling
    let yokeActive = false;
    const yoke = document.getElementById('yoke');

    yoke.addEventListener('mousedown', () => {
      yokeActive = true;
      yoke.classList.add('active');
    });

    document.addEventListener('mousemove', (e) => {
      if (!yokeActive) return;
      const rect = yoke.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;
      const dx = (e.clientX - centerX) / (rect.width / 2) * 30;
      const dy = (e.clientY - centerY) / (rect.height / 2) * 30;
      aircraft.roll = Math.max(-30, Math.min(30, dx));
      aircraft.pitch = Math.max(-30, Math.min(30, -dy));
    });

    document.addEventListener('mouseup', () => {
      yokeActive = false;
      yoke.classList.remove('active');
    });

    // Throttle handling
    let dragThrottle = null;
    document.getElementById('throttle1').addEventListener('mousedown', () => {
      dragThrottle = 1;
    });
    document.getElementById('throttle2').addEventListener('mousedown', () => {
      dragThrottle = 2;
    });

    document.addEventListener('mousemove', (e) => {
      if (!dragThrottle) return;
      const elem = dragThrottle === 1 ? document.getElementById('throttle1') : document.getElementById('throttle2');
      const rect = elem.getBoundingClientRect();
      const y = e.clientY - rect.top;
      const pct = Math.max(0, Math.min(100, 100 - (y / rect.height) * 100));
      if (dragThrottle === 1) aircraft.throttle1 = pct;
      else aircraft.throttle2 = pct;
    });

    document.addEventListener('mouseup', () => {
      dragThrottle = null;
    });

    // Control buttons
    const modes = ['takeoff', 'climb', 'cruise', 'descent'];
    modes.forEach((mode, i) => {
      document.getElementById(`modeBtn${i}`).addEventListener('click', () => {
        aircraft.mode = mode;
        document.querySelectorAll('[id^="modeBtn"]').forEach(btn => btn.classList.remove('active'));
        document.getElementById(`modeBtn${modes.indexOf(mode)}`).classList.add('active');
      });
    });

    document.getElementById('btnAP').addEventListener('click', () => {
      aircraft.autopilot = !aircraft.autopilot;
      document.getElementById('btnAP').classList.toggle('active');
      document.getElementById('apDisplay').textContent = aircraft.autopilot ? 'ON' : 'OFF';
    });

    document.getElementById('btnGear').addEventListener('click', () => {
      aircraft.gearDown = !aircraft.gearDown;
      document.getElementById('btnGear').classList.toggle('active');
      document.getElementById('gearDisplay').textContent = aircraft.gearDown ? 'DOWN' : 'UP';
    });

    document.getElementById('flapsSlider').addEventListener('input', (e) => {
      aircraft.flaps = parseInt(e.target.value);
      const angles = ['0°', '5°', '15°', '25°', '40°'];
      document.getElementById('flapsDisplay').textContent = angles[aircraft.flaps];
    });

    document.getElementById('btnEng1').addEventListener('click', () => {
      aircraft.engine1Running = !aircraft.engine1Running;
      document.getElementById('btnEng1').classList.toggle('active');
    });

    document.getElementById('btnEng2').addEventListener('click', () => {
      aircraft.engine2Running = !aircraft.engine2Running;
      document.getElementById('btnEng2').classList.toggle('active');
    });

    // Flight Physics
    function updateFlightDynamics(dt) {
      // Engine N1 simulation
      if (aircraft.engine1Running) {
        aircraft.n1_1 = Math.min(100, aircraft.n1_1 + (aircraft.throttle1 - aircraft.n1_1) * 0.1);
      } else {
        aircraft.n1_1 = Math.max(0, aircraft.n1_1 - 0.05);
      }

      if (aircraft.engine2Running) {
        aircraft.n1_2 = Math.min(100, aircraft.n1_2 + (aircraft.throttle2 - aircraft.n1_2) * 0.1);
      } else {
        aircraft.n1_2 = Math.max(0, aircraft.n1_2 - 0.05);
      }

      const avgN1 = (aircraft.n1_1 + aircraft.n1_2) / 2;
      const thrust = avgN1 * 120000;

      // Drag calculation
      let dragCoeff = 0.025;
      if (aircraft.flaps > 0) dragCoeff += 0.015 * aircraft.flaps;
      if (aircraft.gearDown) dragCoeff += 0.02;

      const dynamicPressure = 0.5 * 0.002377 * aircraft.speed * aircraft.speed;
      const drag = dragCoeff * dynamicPressure * 1320;

      // Speed dynamics
      const accel = ((thrust - drag) / 340000) * 32.174 * dt;
      aircraft.speed += accel;
      aircraft.speed = Math.max(0, aircraft.speed);

      // Vertical dynamics
      const liftCoeff = 0.3 + (aircraft.pitch * 0.05) + (aircraft.flaps * 0.2);
      const lift = liftCoeff * dynamicPressure * 1320;
      const vertAccel = ((lift - 340000) / 340000) * 32.174 * dt;
      aircraft.verticalSpeed += vertAccel;
      aircraft.altitude += aircraft.verticalSpeed * dt;
      aircraft.altitude = Math.max(0, aircraft.altitude);

      // Autopilot
      if (aircraft.autopilot) {
        const hdgDiff = aircraft.targetHeading - aircraft.heading;
        const rollTarget = Math.max(-25, Math.min(25, hdgDiff * 0.5));
        aircraft.roll += (rollTarget - aircraft.roll) * 0.05;

        const altDiff = aircraft.targetAltitude - aircraft.altitude;
        const pitchTarget = Math.max(-10, Math.min(10, altDiff * 0.00005));
        aircraft.pitch += (pitchTarget - aircraft.pitch) * 0.03;
      }

      // Damping
      aircraft.pitch *= 0.98;
      aircraft.roll *= 0.96;

      // Heading update
      if (Math.abs(aircraft.roll) > 1) {
        aircraft.heading += Math.sin(aircraft.roll * Math.PI / 180) * 0.3 * dt * 60;
        if (aircraft.heading < 0) aircraft.heading += 360;
        if (aircraft.heading >= 360) aircraft.heading -= 360;
      }

      // Fuel consumption
      aircraft.fuel -= avgN1 * 0.1 * dt;
      aircraft.fuel = Math.max(0, aircraft.fuel);

      // Flight time
      aircraft.flightTime += dt;
    }

    // Update display
    function updateDisplay() {
      document.getElementById('altValue').textContent = Math.round(aircraft.altitude).toLocaleString() + ' ft';
      document.getElementById('speedValue').textContent = Math.round(aircraft.speed) + ' kts';
      document.getElementById('vsValue').textContent = Math.round(aircraft.verticalSpeed) + ' fpm';
      document.getElementById('headingValue').textContent = Math.round(aircraft.heading).toString().padStart(3, '0') + '°';
      document.getElementById('pitchValue').textContent = aircraft.pitch.toFixed(1) + '°';
      document.getElementById('bankValue').textContent = aircraft.roll.toFixed(1) + '°';
      document.getElementById('fuelValue').textContent = Math.round(aircraft.fuel).toLocaleString() + ' kg';
      document.getElementById('n1Value').textContent = Math.round((aircraft.n1_1 + aircraft.n1_2) / 2) + '%';
      document.getElementById('throttle1Value').textContent = Math.round(aircraft.throttle1) + '%';
      document.getElementById('throttle2Value').textContent = Math.round(aircraft.throttle2) + '%';

      document.getElementById('throttle1').querySelector('.throttle-fill').style.height = aircraft.throttle1 + '%';
      document.getElementById('throttle2').querySelector('.throttle-fill').style.height = aircraft.throttle2 + '%';

      const hours = Math.floor(aircraft.flightTime / 3600);
      const mins = Math.floor((aircraft.flightTime % 3600) / 60);
      const secs = Math.floor(aircraft.flightTime % 60);
      document.getElementById('flightTime').textContent = String(hours).padStart(2, '0') + ':' + String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');

      let status = 'FLYING';
      if (aircraft.altitude < 50) status = 'GROUND';
      if (aircraft.speed < 50 && aircraft.altitude < 100) status = 'PARKED';
      document.getElementById('statusText').textContent = status;
    }

    // Main animation loop
    let lastTime = performance.now();
    function animate(currentTime) {
      const dt = (currentTime - lastTime) / 1000;
      lastTime = currentTime;

      updateFlightDynamics(dt);
      updateDisplay();

      // Update aircraft rotation
      a320.rotation.x = aircraft.pitch * Math.PI / 180;
      a320.rotation.z = aircraft.roll * Math.PI / 180;
      a320.rotation.y = aircraft.heading * Math.PI / 180;

      // Update aircraft position
      const radHeading = aircraft.heading * Math.PI / 180;
      a320.position.x += Math.sin(radHeading) * aircraft.speed * dt * 0.1;
      a320.position.z += Math.cos(radHeading) * aircraft.speed * dt * 0.1;
      a320.position.y = aircraft.altitude * 0.01;

      // Update camera to follow aircraft
      const distance = 80;
      const height = 30;
      const camX = a320.position.x - Math.sin(radHeading) * distance;
      const camZ = a320.position.z - Math.cos(radHeading) * distance;
      camera.position.x = camX;
      camera.position.y = a320.position.y + height;
      camera.position.z = camZ;
      camera.lookAt(a320.position);

      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    window.addEventListener('resize', () => {
      const width = canvas.clientWidth;
      const height = canvas.clientHeight;
      renderer.setSize(width, height);
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
    });

    animate(performance.now());
  </script>
</body>
</html>
